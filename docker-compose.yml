services:
  backend:
    build: .
    container_name: mapwala_backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
      - media_volume:/app/media
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db

  db:
    image: postgres:15
    container_name: mapwala_db
    restart: always
    environment:
      POSTGRES_DB: mapwala_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Skytrack976531
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  postgres_data:
  media_volume:
