services:
  backend:
    build: .
    container_name: mapwala_backend
    volumes:
      - .:/app
      - media_volume:/app/media
    ports:
      - "6631:6631"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env

  db:
    image: postgres:15
    container_name: mapwala_db
    restart: always
    profiles:
      - localdb
    environment:
      POSTGRES_DB: ${DOCKER_DB_NAME:-mapwala_db}
      POSTGRES_USER: ${DOCKER_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DOCKER_DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  postgres_data:
  media_volume:
